<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
     const students = [
    {
        name: "Gab",
        score: 85
    },
    {
        name: "John",
        score: 72
    },
    {
        name: "Maria",
        score: 95
    }
];

    function getGrade(score) {
    if (score >= 90) {
        return "A";
    } else if (score >= 80) {
        return "B";
    } else if (score >= 70) {
        return "C";
    } else if (score >= 60) {
        return "D";
    } else {
        return "F";
    }
}

    console.log(getGrade(students[0].score))
    </script>
</body>
</html>
